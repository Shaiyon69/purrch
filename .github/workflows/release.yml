name: Release

# Pushing a v* tag builds the Windows installer and the Linux AppImage and publishes both
# on one GitHub release. Run it by hand with a tag to (re)build an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.2
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PurrchSetup.exe
          path: dist/PurrchSetup.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # A release written by hand keeps its notes; the builds replace any old assets.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "Purrch ${TAG#v}" --generate-notes
          fi
