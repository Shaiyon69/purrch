name: Release

# Pushing a v* tag builds the Windows installer and the Linux AppImage and publishes both as the
# purrch-v* release on Shaiyon69/Skibidevs: binaries ship only from the website, never from this repo.
# Run it by hand with a tag to (re)build an existing release.
# SKIBIDEVS_TOKEN: fine-grained token with Contents read/write on Shaiyon69/Skibidevs only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.2
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PurrchSetup.exe
          path: dist/PurrchSetup.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # A release written by hand keeps its notes; the builds replace any old assets.
      - name: Publish Skibidevs release
        env:
          GH_TOKEN: ${{ secrets.SKIBIDEVS_TOKEN }}
          GH_REPO: Shaiyon69/Skibidevs
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Set the SKIBIDEVS_TOKEN secret"; exit 1; }
          if gh release view "purrch-$TAG" >/dev/null 2>&1; then
            gh release upload "purrch-$TAG" assets/* --clobber
          else
            gh release create "purrch-$TAG" assets/* --title "Purrch ${TAG#v}" --notes "Changes: https://github.com/Shaiyon69/purrch/commits/$TAG"
          fi
          # The site refreshes its download list on this event.
          gh api "repos/$GH_REPO/dispatches" -f event_type=app-released
