[package]
name = "purrch"
version = "1.0.0"
edition = "2024"
description = "A cat that lives in your notch. Water reminders, focus timer, to-dos, music and a file shelf for Windows."
license = "MIT"

[dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Foundation",
    "Data_Json",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Win32_Devices_FunctionDiscovery",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Media_Control",
    "Networking_Connectivity",
    "Storage_Streams",
    "Web_Http",
    "Web_Http_Headers",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3"
